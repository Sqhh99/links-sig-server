[package]
name = "links-sig-rust-server"
version = "0.1.0"
edition = "2021"
description = "LiveKit signaling server implemented in Rust with Axum"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment and config
dotenvy = "0.15"

# JWT for LiveKit tokens
jsonwebtoken = "9"

# HTTP client for LiveKit API
reqwest = { version = "0.11", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64 encoding for Twirp
base64 = "0.21"

# Protobuf for LiveKit API (Twirp)
prost = "0.12"

# Official LiveKit API SDK
livekit-api = "0.4"

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"

# ============================================================================
# Build Optimization
# ============================================================================

[profile.dev]
# Faster incremental builds
incremental = true
# Reduce debug info for faster builds (0=none, 1=limited, 2=full)
debug = 1

[profile.dev.package."*"]
# Optimize dependencies in dev mode for faster runtime
opt-level = 1

[profile.test]
# Faster test builds
incremental = true
debug = 1

[profile.test.package."*"]
opt-level = 1

[profile.release]
# Release optimizations
lto = "thin"
codegen-units = 1
strip = true
