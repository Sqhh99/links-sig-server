<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加入会议 — Links</title>
  <meta name="description" content="通过链接加入 Links 会议，无需登录即可观看音视频。" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ============================================================
       JOIN VIEW — Pre-meeting entry form
       ============================================================ -->
  <div id="join-view">
    <div class="join-card">
      <div class="join-card__logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="join-card__logo-icon">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span class="join-card__logo-text">Links Meeting</span>
      </div>
      <p class="join-card__subtitle">加入一场音视频会议</p>

      <div class="join-card__meeting-no border-box">
        <div class="join-card__meeting-no-label">会议号码</div>
        <div class="join-card__meeting-no-value" id="display-meeting-no">—</div>
      </div>

      <div class="form-group hidden" id="password-group">
        <label for="input-password" class="sr-only">会议密码</label>
        <div class="input-with-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" class="input-icon" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-password" placeholder="请输入会议密码" maxlength="32" autocomplete="off" />
        </div>
      </div>

      <button class="btn btn--primary" id="btn-join" type="button">
        加入会议
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>

      <div class="error-msg" id="join-error"></div>
    </div>
  </div>

  <!-- ============================================================
       MEETING VIEW — In-meeting layout
       ============================================================ -->
  <div id="meeting-view">
    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar__info">
        <div class="topbar__topic" id="meeting-topic">会议进行中</div>
        <div class="topbar__meta">
          <span class="meta-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span id="meeting-no-display"></span>
          </span>
          <span class="meta-divisor">|</span>
          <span class="meta-item">
             <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span id="meeting-duration">00:00</span>
          </span>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--outline" id="btn-toggle-members" type="button" title="查看成员">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span class="badge" id="member-count">0</span>
        </button>
        <button class="btn btn--danger" id="btn-leave" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          退出
        </button>
      </div>
    </div>

    <!-- Body: video grid + sidebar -->
    <div class="meeting-body">
      <div class="video-grid" id="video-grid" data-count="0">
        <div class="empty-state" id="empty-state">
          <div class="empty-state__icon">
             <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </div>
          <div class="empty-state__text">等待其他参与者开启视频…</div>
        </div>
      </div>

      <div class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <span>成员列表</span>
          <button class="sidebar__close" id="btn-close-sidebar" type="button" title="关闭">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="sidebar__list" id="member-list"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/livekit-client.umd.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
